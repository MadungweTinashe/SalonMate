<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalonMate</title>
    <link rel="stylesheet" href="style.css">
</head><body><header class="topbar">
    <div>
        <h1>SalonMate</h1>
        <p>Salon management made simple</p>
    </div>
    <button id="addAppointmentBtn">+ Add Appointment</button>
</header>

<main class="container">

    <section class="welcome-card">
        <h2>Welcome to SalonMate 👋</h2>
        <p>Manage your salon appointments, customers and services in one place.</p>
    </section>

    <section class="stats">
        <div class="stat-card">
            <span>Total Appointments</span>
            <strong id="totalAppointments">0</strong>
        </div>

        <div class="stat-card">
            <span>Total Customers</span>
            <strong id="totalCustomers">0</strong>
        </div>

        <div class="stat-card">
            <span>Total Services</span>
            <strong id="totalServices">0</strong>
        </div>
    </section>

    <section class="panel">
        <div class="panel-header">
            <h2>Appointments</h2>
            <button id="clearAppointmentsBtn" class="danger-btn">
                Clear All
            </button>
        </div>

        <div id="appointmentsList" class="appointments-list">
            <p class="empty-message">No appointments yet.</p>
        </div>
    </section>

</main>

<div id="appointmentModal" class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">
            <h2>New Appointment</h2>
            <button id="closeModalBtn" class="close-btn">&times;</button>
        </div>

        <form id="appointmentForm">

            <label for="customerName">Customer Name</label>
            <input
                type="text"
                id="customerName"
                placeholder="Enter customer name"
                required
            >

            <label for="serviceName">Service</label>
            <input
                type="text"
                id="serviceName"
                placeholder="e.g. Haircut"
                required
            >

            <label for="appointmentDate">Date</label>
            <input
                type="date"
                id="appointmentDate"
                required
            >

            <label for="appointmentTime">Time</label>
            <input
                type="time"
                id="appointmentTime"
                required
            >

            <button type="submit" class="save-btn">
                Save Appointment
            </button>

        </form>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
